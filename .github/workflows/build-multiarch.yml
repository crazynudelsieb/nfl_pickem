name: Build Multi-Arch Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image tag (for example v1.2.3). If empty, only latest is used."
        required: false
        type: string
      push_latest:
        description: "Also push :latest"
        required: true
        default: true
        type: boolean
      no_cache:
        description: "Build with --no-cache"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nfl_pickem

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # Prefer PAT with write:packages to avoid package-scoped 403s on blob HEAD checks.
          # Fallback to GITHUB_TOKEN for repositories where package permissions are inherited.
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve build tags
        id: vars
        shell: bash
        # Pass inputs via env instead of interpolating ${{ }} into the script
        # body, so input values can never be executed as shell code.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION_TAG=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION_TAG="${INPUT_VERSION}"
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 + linux/arm64 images
        shell: bash
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          INPUT_NO_CACHE: ${{ inputs.no_cache }}
        run: |
          set -euo pipefail

          PUSH_LATEST="true"
          NO_CACHE="true"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PUSH_LATEST="${INPUT_PUSH_LATEST}"
            NO_CACHE="${INPUT_NO_CACHE}"
          fi

          if [[ "${PUSH_LATEST}" != "true" && -z "${VERSION_TAG}" ]]; then
            echo "No tags selected; aborting build."
            exit 1
          fi

          build_image() {
            local image_name="$1"
            local dockerfile="$2"
            local cmd=(docker buildx build --platform linux/amd64,linux/arm64)

            if [[ "${NO_CACHE}" == "true" ]]; then
              cmd+=(--no-cache)
            fi

            if [[ "${PUSH_LATEST}" == "true" ]]; then
              cmd+=( -t "${image_name}:latest" )
            fi

            if [[ -n "${VERSION_TAG}" ]]; then
              cmd+=( -t "${image_name}:${VERSION_TAG}" )
            fi

            cmd+=( -f "${dockerfile}" --push . )

            echo "Building image ${image_name} for linux/amd64,linux/arm64"
            echo "Dockerfile: ${dockerfile}"
            "${cmd[@]}"
          }

          build_image "${APP_IMAGE_NAME}" "Dockerfile"
