name: CI

# Every push and pull request. The release workflow calls this one as its gate,
# so an image can never be published from a tree that does not lint, pass its
# tests, boot, and build.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call: # reused by build-multiarch.yml as its gate

permissions:
  contents: read

concurrency:
  # github.workflow resolves to the *calling* workflow's name, so a release
  # build's gate lands in its own group. Without that, a push to main during a
  # release would cancel the release's own checks and fail the build.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the interpreter in the Dockerfile. Unlike a library, this
          # app ships on exactly one runtime, so the checks run on that one.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      # Whole tree, not just app/. Rules live in ruff.toml. The narrower
      # `ruff check app tests scripts` this replaces skipped manage.py and
      # config.py entirely, which is how an undefined name survived there.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  smoke:
    name: Install and boot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Track the Dockerfile base image.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Resolving the pinned set is itself a test: a dependency bump that
      # conflicts with the pins fails here instead of at deploy time.
      - name: Install
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Boot the app and run the smoke test
        env:
          SCHEDULER_ENABLED: "False"
          SECRET_KEY: ci-smoke-test-key
          WTF_CSRF_SECRET_KEY: ci-smoke-test-csrf-key
          DATABASE_URL: sqlite:///ci-smoke.db
          # Socket.IO rejects unlisted origins, so name the one the test uses.
          ALLOWED_ORIGINS: http://127.0.0.1:5000
        run: |
          set -euo pipefail

          # Same worker configuration the production image runs, so a Gunicorn
          # release that drops a worker class fails the PR, not the deploy.
          gunicorn -k gthread -w 1 --threads 100 --timeout 120 \
            --bind 127.0.0.1:5000 --log-level info run:app > gunicorn.log 2>&1 &
          gunicorn_pid=$!

          if ! python scripts/smoke_test.py http://127.0.0.1:5000; then
            echo "----- gunicorn output -----"
            cat gunicorn.log
            kill "$gunicorn_pid" 2>/dev/null || true
            exit 1
          fi

          kill "$gunicorn_pid" 2>/dev/null || true

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [check, smoke]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # amd64 only and no push: this validates the Dockerfile on every PR,
      # while the tagged multi-arch release build stays in build-multiarch.yml.
      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
